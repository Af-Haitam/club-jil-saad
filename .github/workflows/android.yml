# بناء قشرة أندرويد (TWA) وتوقيعها.
#
# يُشغَّل باليد فقط. الموقع نفسه لا يحتاج هذا البناء إطلاقًا — نشرُ Vercel يصل
# إلى كلّ هاتفٍ مثبَّت فورًا. لا يُبنى إلّا إذا تغيّر اسم التطبيق أو أيقونته
# أو رابط إقلاعه.
#
# المفتاح لا يعيش في المستودع. يأتي من أسرار المستودع، ويُمحى مع المُشغِّل.

name: بناء تطبيق أندرويد

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "رقم الإصدار الظاهر (مثال 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
          # الخطوات التي تعمل بـ run تبدأ في android/ (defaults أعلاه)، أمّا
          # هذه الخطوة فتعمل من جذر المستودع — فتُدلّ على المشروع صراحةً.
          build-root-directory: android

      - name: فكّ مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::السرّ ANDROID_KEYSTORE_BASE64 غير مضبوط على المستودع."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"

      - name: البناء
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: gradle --no-daemon assembleRelease

      # هذه الخطوة هي جوهر الأمان في هذا الملف. بصمة الشهادة التي وقّعت الـAPK
      # يجب أن تطابق ما في ‎/.well-known/assetlinks.json حرفًا بحرف؛ وإلّا فتح
      # التطبيق بشريط عنوان المتصفّح فوقه ولم نكتشف ذلك إلّا على هاتف عضو.
      # فليفشل البناء هنا، لا هناك.
      - name: التحقّق من التوقيع ومطابقة البصمة
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "── التوقيع ──"
          "$SIGNER" verify --verbose --print-certs "$APK"

          ACTUAL=$("$SIGNER" verify --print-certs "$APK" \
            | grep -im1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-Z' 'a-z')
          EXPECTED=$(python3 -c "import json;print(json.load(open('../public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0].replace(':','').lower())")

          echo "بصمة الـAPK      : $ACTUAL"
          echo "بصمة assetlinks : $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::البصمتان لا تتطابقان — سيفتح التطبيق بشريط عنوان."
            exit 1
          fi

          echo "── بطاقة التطبيق ──"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -E "^(package|application-label|launchable-activity|sdkVersion|targetSdkVersion|uses-permission)"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
