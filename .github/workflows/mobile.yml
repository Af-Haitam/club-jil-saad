# بناء تطبيق الأعضاء (Expo / React Native) وتوقيعه.
#
# لا حساب EAS ولا اشتراك: `expo prebuild` يولّد مشروع أندرويد، وGradle على
# مُشغِّل GitHub يبنيه — والمُشغِّل يحمل JDK وAndroid SDK جاهزين.
#
# يوقَّع **بنفس مفتاح قشرة TWA وباسم الحزمة نفسه**، فيصل إلى من ثبّت القشرة
# تحديثًا في مكانها لا تطبيقًا ثانيًا بجانبها.

name: بناء تطبيق الأعضاء

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "رقم الإصدار الظاهر (مثال 2.0.0)"
        required: true
        default: "2.0.0"
      variant:
        description: "نسخة التجربة تُثبَّت بجانب التطبيق لا مكانه"
        type: choice
        options: ["release", "beta"]
        default: "beta"

# الكتابة لازمة لرفع الحزمة إلى الإصدارات — والرفع من المُشغِّل نفسه
# لا من جهاز أحد: الملفّ ٥٧ م.ب، ومنبعه هنا أصلًا.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: تركيب الحزم
        run: npm ci

      - name: توليد مشروع أندرويد
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.versionName }}
          APP_VARIANT: ${{ inputs.variant }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx expo prebuild --platform android --no-install

      - name: فكّ مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::السرّ ANDROID_KEYSTORE_BASE64 غير مضبوط."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.p12"

      - name: البناء
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # يُخبز في حزمة الجافاسكريبت، فيلزم هنا أيضًا لا في التوليد وحده
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          APP_VARIANT: ${{ inputs.variant }}
          VERSION_NAME: ${{ inputs.versionName }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: التحقّق من التوقيع والهوية
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          echo "── التوقيع ──"
          "$SIGNER" verify --print-certs "$APK"

          ACTUAL=$("$SIGNER" verify --print-certs "$APK" \
            | grep -im1 'SHA-256 digest' | awk '{print $NF}' | tr 'A-Z' 'a-z')
          EXPECTED=$(python3 -c "import json;print(json.load(open('../public/.well-known/assetlinks.json'))[0]['target']['sha256_cert_fingerprints'][0].replace(':','').lower())")

          # نفس المفتاح تمامًا، وإلّا لم يكن تحديثًا لما ثبّته الأعضاء بل
          # تطبيقًا غريبًا يرفض أندرويد تركيبه مكانه.
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::وُقّع بمفتاح غير مفتاح النادي — لن يُثبَّت فوق النسخة الحالية."
            echo "apk=$ACTUAL  expected=$EXPECTED"
            exit 1
          fi
          echo "المفتاح مطابق ✓"

          echo "── بطاقة التطبيق ──"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission)" \
            || true
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" \
            | grep -m1 "application-label:"

          cp "$APK" "$RUNNER_TEMP/club-jil-saad-${{ inputs.variant }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/club-jil-saad-${{ inputs.variant }}.apk
          if-no-files-found: error

      # ── النشر ───────────────────────────────────────────────────────────
      # وسمٌ ثابت لكلّ نسخة (‎app-latest‎ و‎app-beta‎) لا وسمٌ لكلّ إصدار،
      # فرابط التنزيل لا يتغيّر أبدًا وصفحة ‎/app‎ لا تُعدَّل مع كلّ بناء.
      #
      # ولماذا الإصدارات لا ‎public/download‎؟ لأنّ Vercel اعترض تنزيل الحزمة
      # فعلًا بصفحة تحقّقٍ حين تتابعت التنزيلات الكبيرة — وصفحة HTML تُحفَظ
      # باسم ‎.apk‎ فيقول الهاتف «مشكلة في تحليل الحزمة». وأصولُ الإصدارات
      # بلا حدٍّ ولا اعتراض، ولا تُثقل مستودع git بـ٥٧ م.ب في كلّ بناء.
      - name: النشر إلى الإصدارات
        env:
          GH_TOKEN: ${{ github.token }}
          VARIANT: ${{ inputs.variant }}
          VERSION: ${{ inputs.versionName }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/club-jil-saad-$VARIANT.apk"

          if [ "$VARIANT" = "beta" ]; then
            TAG="app-beta"; TITLE="نسخة التجربة $VERSION"; FLAGS="--prerelease"
          else
            TAG="app-latest"; TITLE="تطبيق الأعضاء $VERSION"; FLAGS=""
          fi

          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(du -m "$APK" | cut -f1)

          # البصمة في المتن ليست زينة: بها يُتحقَّق أنّ ما نزل هو ما بُني،
          # وقد نزلت مرّةً حزمةٌ مبتورة فضاع يومان في البحث عن سببٍ وهمي.
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          **الإصدار $VERSION** — بُني في $(date -u '+%Y-%m-%d %H:%M') UTC من \`${GITHUB_SHA:0:7}\`.

          | | |
          |---|---|
          | الحجم | $SIZE م.ب |
          | sha256 | \`$SUM\` |

          طريقة التثبيت مشروحة بالعربية في <https://club-jil-saad.vercel.app/app>.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" $FLAGS
          fi

          gh release upload "$TAG" "$APK" --clobber
          echo "نُشر: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$(basename "$APK")"
